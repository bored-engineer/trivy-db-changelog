name: Cron
# Overlaid onto the "changelog" branch's .github/workflows/cron.yml by
# update-changelog.sh, so GitHub can still find and schedule it there if
# "changelog" is ever made this repository's default branch. Lives here
# rather than in .github/workflows/ so it isn't *also* picked up as a
# second, duplicate schedule trigger on this branch.
#
# Just forwards to the real implementation on the "generator" branch via a
# ref-pinned reusable workflow call, so this file only needs to track the
# trigger declarations below (which rarely change), never the job logic.
on:
  schedule:
    - cron: "0 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      max_digests:
        description: 'Maximum number of missing digests to export in this run (do not exceed 256, the GitHub Actions per-matrix job limit)'
        required: false
        type: number
        default: 256
      start_date:
        description: 'Only consider digests created after this RFC3339 timestamp (default: the schema v1->v2 cutoff; v1 digests are permanently unexportable)'
        required: false
        type: string
        default: '2022-01-04T18:07:01Z'
      cutoff_date:
        description: 'Only consider digests created at/before this RFC3339 timestamp (default: unbounded, i.e. up to now). Combined with start_date, lets multiple runs backfill disjoint date ranges in parallel.'
        required: false
        type: string
        default: ''

jobs:
  cron:
    permissions:
      contents: write
      packages: read
    uses: bored-engineer/trivy-db-changelog/.github/workflows/cron.yml@generator
    with:
      max_digests: ${{ inputs.max_digests || 256 }}
      start_date: ${{ inputs.start_date || '2022-01-04T18:07:01Z' }}
      cutoff_date: ${{ inputs.cutoff_date || '' }}
    secrets: inherit
