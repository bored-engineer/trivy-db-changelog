name: Cron

on:
  schedule:
    # Upstream builds a new trivy-db every "0 */6 * * *" UTC:
    # https://github.com/aquasecurity/trivy-db/blob/4be526083c54840c19bee77100fbd25ae53eaf63/.github/workflows/cron.yml#L5
    # Recent runs took up to ~1h40m from schedule to completion, so offset
    # by 2h to give that build time to finish before we look for new digests.
    - cron: "0 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      max_digests:
        description: 'Maximum number of missing digests to export in this run (do not exceed 256, the GitHub Actions per-matrix job limit)'
        required: false
        type: number
        default: 256
      start_date:
        description: 'Only consider digests created after this RFC3339 timestamp (default: the schema v1->v2 cutoff; v1 digests are permanently unexportable)'
        required: false
        type: string
        default: '2022-01-04T18:07:01Z'
      cutoff_date:
        description: 'Only consider digests created at/before this RFC3339 timestamp (default: unbounded, i.e. up to now). Combined with start_date, lets multiple runs backfill disjoint date ranges in parallel.'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  packages: read

env:
  # Caps how many newly-discovered digests are exported per run, so a large
  # backlog (e.g. on first deploy) fills in gradually instead of firing
  # thousands of parallel exports at once. Defaults to 256, the max size of
  # a single GitHub Actions matrix, since that's also the hard ceiling here.
  # workflow_dispatch always has a value (user-supplied or the default
  # above); schedule runs don't, so they fall back to the same default.
  MAX_DIGESTS_PER_RUN: ${{ inputs.max_digests || 256 }}
  START_DATE: ${{ inputs.start_date || '2022-01-04T18:07:01Z' }}
  CUTOFF_DATE: ${{ inputs.cutoff_date || '' }}

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.diff.outputs.digests }}
    steps:
      - name: List already-exported digests
        run: |
          git ls-remote "https://github.com/${{ github.repository }}" 'refs/raw/*' \
            | awk '{print $2}' \
            | sed -E 's#^refs/raw/sha256-#sha256:#' \
            > existing.txt
          echo "$(wc -l < existing.txt) digest(s) already in refs/raw"

      - name: List trivy-db digests in range, oldest first
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # start_date/cutoff_date bound the range considered (default start
          # excludes schema v1, which cmd/export permanently rejects). This
          # lets separate runs backfill disjoint date ranges in parallel
          # instead of each one re-scanning and re-skipping the same digests.
          gh api --paginate 'orgs/aquasecurity/packages/container/trivy-db/versions?per_page=100' --jq '.[]' \
            | jq -r --arg start "$START_DATE" --arg cutoff "$CUTOFF_DATE" \
                'select(.created_at > $start and ($cutoff == "" or .created_at <= $cutoff)) | "\(.created_at)\t\(.name)"' \
            | sort > upstream.tsv
          echo "$(wc -l < upstream.tsv) digest(s) upstream in range ($START_DATE, ${CUTOFF_DATE:-now}]"

      - name: Compute missing digests
        id: diff
        run: |
          missing=$(awk -F'\t' 'NR==FNR{seen[$1];next} !($2 in seen){print $2}' existing.txt upstream.tsv \
            | head -n "$MAX_DIGESTS_PER_RUN")
          echo "$(printf '%s\n' "$missing" | grep -c .) digest(s) missing this run (capped at $MAX_DIGESTS_PER_RUN)"
          digests=$(printf '%s\n' "$missing" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "digests=$digests" >> "$GITHUB_OUTPUT"

  export:
    needs: discover
    if: needs.discover.outputs.digests != '[]'
    strategy:
      fail-fast: false
      matrix:
        digest: ${{ fromJson(needs.discover.outputs.digests) }}
    uses: ./.github/workflows/export.yml
    with:
      digest: ${{ matrix.digest }}
