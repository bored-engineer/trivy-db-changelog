name: Export

on:
  workflow_dispatch:
    inputs:
      digest:
        description: 'Digest of ghcr.io/aquasecurity/trivy-db to export (e.g. sha256:abcdef...)'
        required: true
        type: string
  workflow_call:
    inputs:
      digest:
        description: 'Digest of ghcr.io/aquasecurity/trivy-db to export (e.g. sha256:abcdef...)'
        required: true
        type: string

# bash -eo pipefail for every run step (GitHub's default without an explicit
# shell is bash -e, no pipefail), so a failure early in a pipeline fails the
# step instead of leaving it with partial or empty output.
defaults:
  run:
    shell: bash

permissions:
  contents: write
  packages: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pinned regardless of the repo's default branch (which may be
          # "changelog", a branch of pure trivy-db snapshots with no Go code).
          ref: generator

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Log in to ghcr.io
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Export trivy-db
        # cmd/export ends its stream with fast-import's "done" only on
        # success, so a failed export never leaves a (truncated) ref behind;
        # the Push step's ref check double-checks it.
        run: go run ./cmd/export "ghcr.io/aquasecurity/trivy-db@${{ inputs.digest }}" | git fast-import --quiet

      - name: Push ref
        run: |
          ref=$(git for-each-ref --format='%(refname)' refs/raw)
          if [ -z "$ref" ]; then
            echo "no refs/raw/* ref was created by the export" >&2
            exit 1
          fi
          # Force-push: cmd/export always resets this ref to a fresh orphan
          # commit, so re-running against an already-exported digest is
          # never a fast-forward.
          #
          # Retried: with many export jobs pushing to the same repo at once,
          # GitHub occasionally returns a transient "Internal Server Error"
          # on the push itself (retrying the exact same push succeeds).
          for attempt in 1 2 3 4 5; do
            if git push --force origin "$ref:$ref"; then
              exit 0
            fi
            echo "push attempt $attempt failed, retrying after a pause" >&2
            sleep $((attempt * 10))
          done
          echo "push failed after 5 attempts" >&2
          exit 1
